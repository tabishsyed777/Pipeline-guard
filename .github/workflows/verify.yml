name: Verify PipelineGuard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: pipelineguard inspect --input examples/orders-healthy.csv --contract examples/contract.json --out runs/installed-cli
      - name: Unit and component tests
        run: python -m unittest discover -s tests -p test_pipelineguard.py -v
      - name: CLI integration tests
        run: python -m unittest discover -s tests -p test_cli_integration.py -v
      - run: python -m pipelineguard.demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipelineguard-evidence-python-${{ matrix.python }}
          path: runs/demo/
